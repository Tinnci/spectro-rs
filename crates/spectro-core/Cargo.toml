[package]
name = "spectro-rs"
version = "0.3.7"
edition = "2024"
authors = ["Tinnci <shisoratsu@icloud.com>"]
description = "A high-performance Rust driver for X-Rite ColorMunki spectrometers"
license = "GPL-3.0"
repository = "https://github.com/Tinnci/spectro-rs"
readme = "README.md"
categories = ["hardware-support", "science", "embedded"]
keywords = ["spectrometer", "colormunki", "colorimetry", "usb", "xrite"]

[dependencies]
rusb = "0.9.4"
thiserror = "2.0.11"
rust-embed = "8.4.0"
i18n-embed = { version = "0.14.1", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.8.0"
sys-locale = "0.3.1"
dialoguer = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
crossbeam-channel = "0.5.13"
rand = "0.8"
sobol_burley = "0.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSWindow", "NSView", "NSColor", "NSColorSpace", "NSApplication", "NSScreen", "NSGraphicsContext", "NSCursor", "NSImage", "NSBitmapImageRep", "NSResponder", "NSPanel", "NSWindowScripting"] }
objc2-foundation = { version = "0.2.2", features = ["NSGeometry", "NSArray", "NSString", "NSValue", "NSThread"] }
core-graphics = "0.23.2"
